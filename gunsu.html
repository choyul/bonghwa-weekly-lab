const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
 return new TextDecoder().decode(pt);
}
function show(h){document.open();document.write(h);document.close()}
const c=document.getElementById('c'),b=document.getElementById('b'),e=document.getElementById('e');
async function go(code,quiet){
 if(!code)return;
 if(!window.crypto||!crypto.subtle){e.textContent='이 브라우저에서는 열 수 없습니다. 크롬이나 사파리로 열어 주세요.';return}
 b.disabled=true;b.textContent='여는 중…';
 try{const h=await unlock(code);try{localStorage.setItem(K,code)}catch(x){}show(h)}
 catch(x){try{localStorage.removeItem(K)}catch(y){}b.disabled=false;b.textContent='확인';if(!quiet){e.textContent='코드가 맞지 않습니다.';c.value='';c.focus()}}
}
b.onclick=()=>go(c.value.trim());
c.onkeydown=ev=>{if(ev.key==='Enter')go(c.value.trim())};
c.oninput=()=>{e.textContent=''};
let saved='';try{saved=localStorage.getItem(K)||''}catch(x){}
if(saved)go(saved,true);else c.focus();
