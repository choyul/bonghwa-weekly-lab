<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>[테스트] 장터 판매자·글 승인</title>
<link rel="stylesheet" href="bonghwa-tokens.css">
<style>
:root{--paper:#fff;--bg:#F4F5F2;--ink:#121E18;--sub:#5F7168;--faint:#98A2AE;
 --line:#DDE8E2;--acc:#16A34A;--acc-soft:#E8F7EE;--warn:#B85C22;--warn-soft:#FBEFE5;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:Pretendard,-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.65}
#labBanner{position:sticky;top:0;z-index:99;background:#C2410C;color:#fff;text-align:center;
 font-size:13px;font-weight:800;padding:8px 12px}
.wrap{max-width:920px;margin:0 auto;padding:16px 14px 80px}
h1{font-size:20px;margin:14px 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);font-size:13.5px;margin:0 0 16px}
.priv{background:#FDECEA;border:1px solid #F3C0BA;color:#8A1F17;border-radius:12px;
 padding:11px 13px;font-size:13px;font-weight:700;line-height:1.65;margin-bottom:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
 background:var(--paper);color:var(--ink);min-height:42px}
input[type=text],input[type=search],input[type=password]{width:100%}
button{font:inherit;padding:9px 14px;min-height:42px;border:1px solid var(--line);border-radius:10px;
 background:var(--paper);color:var(--ink);cursor:pointer;font-weight:600}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{min-height:36px;padding:6px 12px;font-size:13px}
button.del{color:var(--warn);border-color:var(--warn-soft)}
button[disabled]{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;font-weight:700}
.tabs button.on{background:var(--acc-soft);border-color:var(--acc);color:#0F7A38}
.pill{font-size:11px;font-weight:800;border-radius:100px;padding:2px 8px;white-space:nowrap}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.on{background:var(--acc-soft);color:#0F7A38}
.pill.off{background:var(--bg);color:var(--faint)}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hd .t{flex:1;min-width:0;font-weight:800;font-size:16px}
dl.f{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:14px}
dl.f dt{color:var(--sub);white-space:nowrap}
dl.f dd{margin:0}
dl.f dd.pv{font-weight:800;background:#FDECEA;border-radius:6px;padding:0 8px;
 justify-self:start}
a.tel{font-weight:800;color:#1D5DBB;text-decoration:none}
.desc{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;
 font-size:14px;line-height:1.7;margin:0 0 10px;word-break:keep-all}
.hint{font-size:12.5px;color:var(--sub);margin:8px 0 0;line-height:1.6}
.empty{padding:34px 10px;text-align:center;color:var(--sub)}
#gate{max-width:360px;margin:60px auto;text-align:center}
.msg{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;
 background:#121E18;color:#fff;border-radius:100px;padding:10px 18px;font-size:14px;font-weight:700;
 opacity:0;transition:opacity .2s}
.msg.on{opacity:1}
</style></head><body>
<div id="labBanner">테스트 버전입니다. 여기서 승인한 내용은 테스트 서버에 저장됩니다.</div>
<div class="wrap">

<div id="gate">
  <h1>장터 판매자·글 승인</h1>
  <p class="lead">담당자 화면입니다. 열람 코드를 넣어 주세요.</p>
  <div class="row"><input type="password" id="code" placeholder="열람 코드" style="flex:1">
    <button class="pri" id="go">들어가기</button></div>
  <p class="hint">시험용 코드: <b>bonghwa</b></p>
</div>

<div id="app" style="display:none">
  <h1>장터 판매자·글 승인</h1>
  <p class="lead">게이트는 <b>글이 아니라 사람</b>에 걸려 있습니다.
    전화로 한 번 확인하고 승인하면, 그 뒤로는 그분이 자유롭게 올리십니다.</p>
  <div class="priv">이 화면에는 주민의 <b>실명과 휴대폰 번호</b>가 있습니다.
    옆 사람에게 화면을 보이지 마시고, 자리를 뜨실 때는 창을 닫아 주십시오.
    화면을 찍어 다른 곳에 보내지 마십시오.</div>

  <div class="tabs">
    <button id="tS" class="on">판매자 신청</button>
    <button id="tM">올라온 글</button>
  </div>
  <div class="row" style="margin-bottom:10px">
    <label class="row" style="gap:6px;font-size:13.5px"><input type="checkbox" id="onlyWait" checked
      style="width:20px;height:20px;min-height:20px;accent-color:var(--acc)"> 기다리는 것만 보기</label>
    <span style="flex:1"></span>
    <button class="sm" id="reload">새로 읽기</button>
  </div>
  <div id="list"></div>
</div>
</div>
<div class="msg" id="msg"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   장터 담당자 화면 — 판매자 승인과 글 승인 두 가지만 한다.
   주민 화면(index.html)과 같은 서버를 보되, 여기서만 실명·전화가 보인다.
   ═══════════════════════════════════════════════════════════════ */
/* 시험할 때만 ?api=http://localhost:8787 로 바꿔 볼 수 있다. 로컬 주소가 아니면 무시한다 —
   낯선 주소가 붙은 링크를 열어 열람 코드를 남의 서버로 보내게 되면 안 된다. */
const QA = new URLSearchParams(location.search).get('api') || '';
const EP = /^http:\/\/localhost:\d+$/.test(QA) ? QA : 'https://bonghwa-lab.balance-cho.workers.dev';
const CKEY = 'bhlab.admin.code';
const $ = s => document.querySelector(s);
const E = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const code = () => { try { return sessionStorage.getItem(CKEY) || ''; } catch (e) { return ''; } };
let tab = 'seller', rows = { seller: [], market: [] };

function toast(t) { const m = $('#msg'); m.textContent = t; m.classList.add('on');
  setTimeout(() => m.classList.remove('on'), 2200); }

async function api(path, opt) {
  const r = await fetch(EP + path, { cache: 'no-store', ...opt,
    headers: { 'content-type': 'application/json', 'x-lab-code': code(), ...((opt || {}).headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '서버가 응답하지 않습니다');
  return j;
}

/* ── 들어가기 ── */
$('#go').onclick = async () => {
  const c = $('#code').value.trim();
  try { sessionStorage.setItem(CKEY, c); } catch (e) { }
  try { await api('/admin/seller'); }
  catch (e) { toast(e.message); return; }
  $('#gate').style.display = 'none'; $('#app').style.display = '';
  load();
};
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });

$('#tS').onclick = () => { tab = 'seller'; $('#tS').classList.add('on'); $('#tM').classList.remove('on'); draw(); };
$('#tM').onclick = () => { tab = 'market'; $('#tM').classList.add('on'); $('#tS').classList.remove('on'); draw(); };
$('#onlyWait').onchange = draw;
$('#reload').onclick = () => load();

async function load() {
  $('#list').innerHTML = '<div class="empty">읽는 중…</div>';
  try {
    const [a, b] = await Promise.all([api('/admin/seller'), api('/admin/market')]);
    rows.seller = a.rows || []; rows.market = b.rows || [];
    count(); draw();
  } catch (e) { $('#list').innerHTML = `<div class="empty">${E(e.message)}</div>`; }
}
function count() {
  const s = rows.seller.filter(x => x.state === '대기').length;
  const m = rows.market.filter(x => x.state === '대기').length;
  $('#tS').textContent = '판매자 신청' + (s ? ' (' + s + ')' : '');
  $('#tM').textContent = '올라온 글' + (m ? ' (' + m + ')' : '');
}

function draw() {
  const only = $('#onlyWait').checked;
  const list = rows[tab].filter(x => !only || x.state === '대기');
  if (!list.length) { $('#list').innerHTML =
    `<div class="empty">${only ? '기다리는 것이 없습니다.' : '아직 아무것도 없습니다.'}</div>`; return; }
  $('#list').innerHTML = list.map(tab === 'seller' ? sellerCard : marketCard).join('');
  $('#list').querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b));
}

const pill = st => `<span class="pill ${st === '대기' ? 'wait' : (st === '승인' || st === '판매중' || st === '수확예정' ? 'on' : 'off')}">${E(st)}</span>`;

/* ── 판매자 한 사람 ── */
function sellerCard(s) {
  return `<div class="card" data-id="${E(s.id)}">
    <div class="hd"><span class="t">${E(s.nick)}</span>${pill(s.state)}
      <span class="pill off">${E(s.no)}</span></div>
    <dl class="f">
      <dt>실명</dt><dd class="pv">${E(s.name)}</dd>
      <dt>휴대폰</dt><dd><a class="tel" href="tel:${E(s.phone)}">${E(s.phone)}</a> — 눌러서 바로 걸기</dd>
      <dt>사는 곳</dt><dd>${E(s.town || '-')}</dd>
      <dt>파실 것</dt><dd>${E(s.crops || '-')}</dd>
      ${s.agrix ? `<dt>경영체번호</dt><dd>${E(s.agrix)}</dd>` : ''}
      <dt>신청</dt><dd>${E(s.at)}${s.okAt ? ' · 승인 ' + E(s.okAt) : ''}</dd>
      <dt>첫 글 검수</dt><dd>${s.firstOk ? '끝남 — 다음 글은 바로 올라갑니다' : '아직 — 첫 글은 여기서 한 번 봅니다'}</dd>
    </dl>
    <input type="text" class="memo" placeholder="통화한 내용을 적어 두세요 (예: 8/30 통화, 춘양 사과 직접 재배 확인)"
      value="${E(s.memo || '')}">
    <div class="row" style="margin-top:8px">
      ${s.state !== '승인' ? `<button class="pri sm" data-act="승인">승인</button>` : ''}
      ${s.state === '대기' ? `<button class="sm del" data-act="반려">반려</button>` : ''}
      ${s.state === '승인' ? `<button class="sm del" data-act="정지">정지 (이분 글 전부 내림)</button>` : ''}
      <button class="sm" data-act="메모">메모만 저장</button>
      <span style="flex:1"></span>
      <button class="sm" data-act="재발급">수정키 재발급</button>
    </div>
    <p class="hint">전화로 <b>봉화에 사시는지 · 직접 기른 것인지 · 못 파는 것(가공식품·술·달걀)을 아시는지</b>
      세 가지만 여쭙고 승인하십시오.</p>
  </div>`;
}

/* ── 글 한 건 ── */
function marketCard(m) {
  const d = m.data || {};
  const left = Math.max(0, (+d['수량'] || 0) - (m.sold || 0));
  return `<div class="card" data-id="${E(m.id)}">
    <div class="hd"><span class="t">${E(d['품목'] || '(품목 없음)')}</span>${pill(m.state)}
      ${m.reports ? `<span class="pill wait">신고 ${m.reports}</span>` : ''}</div>
    <dl class="f">
      <dt>판매자</dt><dd>${E(m.nick || '(담당자 등재)')}</dd>
      <dt>값·양</dt><dd>${E(d['가격'] || '')}원 · ${E(d['규격'] || '')} · ${E(d['수량'] || '0')}개
        <b>(남은 ${left})</b></dd>
      <dt>받는 날</dt><dd>${E(d['수령일'] || '-')} ${E(d['수령시각'] || '')} · ${E(d['수령장소'] || '')}</dd>
      <dt>주문 마감</dt><dd>${E(d['마감일시'] || '-')}</dd>
      <dt>올린 때</dt><dd>${E(m.at)}${m.edited ? ' · 고침 ' + E(m.edited) : ''}</dd>
    </dl>
    ${d['설명'] ? `<div class="desc">${E(d['설명'])}</div>` : ''}
    <input type="text" class="memo" placeholder="메모 (반려 사유 등)" value="${E(m.memo || '')}">
    <div class="row" style="margin-top:8px">
      ${m.state === '대기' || m.state === '숨김' ? `<button class="pri sm" data-act="승인">승인</button>` : ''}
      ${m.state === '대기' ? `<button class="sm del" data-act="반려">반려</button>` : ''}
      ${m.state === '판매중' || m.state === '수확예정' ? `<button class="sm" data-act="마감">마감</button>
        <button class="sm del" data-act="숨김">숨김</button>` : ''}
      <span style="flex:1"></span>
      <label class="row" style="gap:5px;font-size:13px">주문 수량
        <input type="number" class="sold" min="0" value="${m.sold || 0}" style="width:84px;min-height:36px">
        <button class="sm" data-act="수량">저장</button></label>
      <button class="sm del" data-act="삭제">삭제</button>
    </div>
  </div>`;
}

/* ── 누름 ── */
async function act(btn) {
  const card = btn.closest('.card'), id = card.dataset.id, a = btn.dataset.act;
  const memo = (card.querySelector('.memo') || {}).value || '';
  if (a === '삭제' && !confirm('이 글을 아주 지웁니다. 되돌릴 수 없습니다.')) return;
  if (a === '정지' && !confirm('이분의 이용을 멈추고, 올라와 있는 글을 모두 내립니다.')) return;
  if (a === '재발급' && !confirm('새 수정키를 만듭니다. 지금 쓰시던 키는 못 쓰게 됩니다.\n전화로 불러 드릴 수 있을 때만 누르십시오.')) return;
  const body = { id, act: a, memo };
  if (a === '수량') body.sold = +(card.querySelector('.sold') || {}).value || 0;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const j = await api('/admin/' + tab, { method: 'POST', body: JSON.stringify(body) });
    if (j.key) prompt('새 수정키입니다. 전화로 불러 드리고 이 창을 닫으십시오.', j.key);
    else toast(a + ' 되었습니다');
    await load();
  } catch (e) {
    card.querySelectorAll('button').forEach(b => b.disabled = false);
    alert(e.message);
  }
}

/* 이미 코드를 넣어 둔 창이면 바로 들어간다 */
if (code()) { $('#code').value = code(); $('#go').click(); }
</script>
</body></html>
